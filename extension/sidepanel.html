<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NeuroTune</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">Listen at your own pace</p>
        <h1>NeuroTune</h1>
        <p class="intro">Control audio and video playing in your active tab.</p>
      </header>

      <section aria-labelledby="mediaHeading">
        <h2 id="mediaHeading">Webpage media</h2>
        <p id="mediaStatus" class="status" aria-live="polite">
          Checking the active tab
        </p>
      </section>

      <section aria-labelledby="speedHeading">
        <h2 id="speedHeading">Playback speed</h2>
        <label for="speedSelect">Set speed for webpage media</label>
        <select id="speedSelect">
          <option value="0.9">0.9x</option>
          <option value="0.95">0.95x</option>
          <option value="1" selected>1.0x</option>
          <option value="1.05">1.05x</option>
        </select>
        <p id="speedStatus" class="helper" aria-live="polite">
          The selected speed will apply to detected and newly added media.
        </p>
      </section>
    </main>
    <script src="audio_player.js"></script>
  </body>
</html>
