<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NeuroTune</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">Listen at your own pace</p>
        <h1>NeuroTune</h1>
        <p class="intro">Your audiobook adapts to your attention.</p>
      </header>

      <section aria-labelledby="importHeading">
        <h2 id="importHeading">Import your audiobook</h2>
        <label class="file-picker" for="audioFile">Choose an audio file</label>
        <input type="file" id="audioFile" accept="audio/*">
        <p id="fileStatus" class="helper" aria-live="polite">No audiobook selected</p>
        <audio id="audiobook" controls aria-label="Audiobook playback"></audio>
      </section>

      <section aria-labelledby="speedHeading">
        <h2 id="speedHeading">Playback speed</h2>
        <label for="speedSelect">Choose a speed</label>
        <select id="speedSelect">
          <option value="0.8">0.8x</option>
          <option value="0.9">0.9x</option>
          <option value="1" selected>1.0x</option>
        </select>
      </section>

      <section aria-labelledby="attentionHeading">
        <h2 id="attentionHeading">Attention monitoring</h2>
        <p id="attentionStatus" class="status" aria-live="polite">
          Waiting for EEG connection
        </p>
        <p id="speedStatus" class="helper" aria-live="polite">
          Normal listening speed
        </p>
      </section>
    </main>
    <script src="audio_player.js"></script>
  </body>
</html>
